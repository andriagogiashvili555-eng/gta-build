name: Build my IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kevinerikjs/gta5-ios-port
      - name: Build IPA
        run: ./build_ipa
      - uses: actions/upload-artifact@v4
        with:
          name: gta5-port-ipa
          path: "*.ipa"
