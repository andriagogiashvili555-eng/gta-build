name: Build my IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Fetch Core Source Code
        uses: actions/checkout@v4
        with:
          repository: kevinerikjs/gta5-ios-port
          ref: main

      - name: Set Script Permissions
        run: chmod +x ./build_ipa

      - name: Compile Game Binary
        run: ./build_ipa

      - name: Package App Installer
        uses: actions/upload-artifact@v4
        with:
          name: gta5-port-ipa
          path: "*.ipa"
